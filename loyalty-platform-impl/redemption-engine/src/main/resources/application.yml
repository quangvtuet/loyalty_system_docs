spring:
  application:
    name: redemption-engine

  datasource:
    url: jdbc:postgresql://localhost:5432/loyalty_db
    username: ${LOYALTY_DB_USERNAME:loyalty_user}
    password: ${LOYALTY_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8083

loyalty:
  services:
    tiering-base-url: ${LOYALTY_TIERING_BASE_URL:http://localhost:8082}
    earning-base-url: ${LOYALTY_EARNING_BASE_URL:http://localhost:8081}

logging:
  level:
    com.loyalty: DEBUG
